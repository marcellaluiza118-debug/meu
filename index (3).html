<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Meu Controle Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: fixed brown sidebar + cream workspace, same family as the studio agenda the user showed. */
:root{
  --bg:#F6F1EB; --panel:#FCFAF7; --line:#E7DCD2; --ink:#2C201C; --muted:#7B6B63;
  --side:#5B3A31; --side-ink:#F3E8E1; --side-mute:#CDB5AA; --side-hover:rgba(255,255,255,.08); --side-on:rgba(255,255,255,.15);
  --brand-bg:#FFFFFF; --brand-ink:#2C201C;
  --chip:#EBD9CF; --chip-ink:#4B2F27; --btn:#5B3A31; --btn-ink:#FBF4EF; --field:#FFFFFF;
  --pos:#3F7452; --pos-bg:#DCEBE0; --neg:#A8402F; --neg-bg:#F6DAD3; --warn:#85601A; --warn-bg:#F6E7C4;
  --hatch:rgba(91,58,49,.06); --overlay:rgba(44,32,28,.45);
  --f-display:'Fraunces',Georgia,'Times New Roman',serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17110F; --panel:#211916; --line:#3A2D28; --ink:#F3EAE4; --muted:#B3A298;
    --side:#2B1E1A; --side-ink:#F3E8E1; --side-mute:#B79F94; --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.12);
    --brand-bg:#F3E8E1; --brand-ink:#2C201C;
    --chip:#4A352E; --chip-ink:#F1DED4; --btn:#D9A58F; --btn-ink:#2A1812; --field:#17110F;
    --pos:#86BC98; --pos-bg:#223A2B; --neg:#EC9382; --neg-bg:#4A2620; --warn:#E3B968; --warn-bg:#443518;
    --hatch:rgba(255,255,255,.04); --overlay:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17110F; --panel:#211916; --line:#3A2D28; --ink:#F3EAE4; --muted:#B3A298;
  --side:#2B1E1A; --side-ink:#F3E8E1; --side-mute:#B79F94; --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.12);
  --brand-bg:#F3E8E1; --brand-ink:#2C201C;
  --chip:#4A352E; --chip-ink:#F1DED4; --btn:#D9A58F; --btn-ink:#2A1812; --field:#17110F;
  --pos:#86BC98; --pos-bg:#223A2B; --neg:#EC9382; --neg-bg:#4A2620; --warn:#E3B968; --warn-bg:#443518;
  --hatch:rgba(255,255,255,.04); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mono{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--side-ink);display:grid;place-items:center;font:italic 600 14px var(--f-display);flex:none}
.brand{background:var(--brand-bg);color:var(--brand-ink);border-radius:12px;padding:13px 14px;font:600 19px/1.1 var(--f-display)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-mute);margin:14px 4px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:500;color:var(--side-ink)}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-on)}
.nav button:focus-visible{outline:2px solid var(--side-ink)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#C4523C;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:14px 4px 0;font-size:13px;color:var(--side-mute);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline;color:var(--side-ink);font-size:13px}
.side-foot button:focus-visible{outline:2px solid var(--side-ink)}

/* main */
.main{padding-block:30px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-inline:clamp(0px,2vw,24px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font:500 clamp(30px,4vw,42px)/1.05 var(--f-display);text-wrap:balance}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.mnav button{border:0;background:transparent;border-radius:8px;min-width:38px;height:38px;display:grid;place-items:center;font-size:18px}
.mnav button:hover{background:var(--chip)}
.mnav .ml{min-width:170px;font-weight:600;padding:0 8px;font-size:15px}
.btn{border:1px solid transparent;background:var(--btn);color:var(--btn-ink);border-radius:11px;padding:10px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.panel h2{font:500 21px/1.2 var(--f-display);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:500 28px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.banner{display:flex;gap:12px;align-items:center;border-radius:14px;padding:14px 18px;font-weight:600}
.banner.pos{background:var(--pos-bg);color:var(--pos)} .banner.neg{background:var(--neg-bg);color:var(--neg)}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.mute{background:var(--chip);color:var(--chip-ink)}
.banner .btn{margin-left:auto}
.note{background:var(--chip);color:var(--chip-ink);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.note .btn{margin-left:auto}
.pill{border:0;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)} .pill.neg{background:var(--neg-bg);color:var(--neg)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
button.pill:hover{filter:brightness(.96)}

/* lists */
.list{display:flex;flex-direction:column;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row-main{flex:1 1 180px;min-width:0}
.row-t{font-weight:600;overflow-wrap:anywhere}
.row-s{font-size:13px;color:var(--muted)}
.row-amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px;text-align:right}
.row-acts{display:flex;gap:10px;min-width:118px;justify-content:flex-end}
.lnk{all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline}
.lnk:hover{color:var(--ink)} .lnk.danger.armed{color:var(--neg);font-weight:700}
.lnk:focus-visible{outline:2px solid var(--btn)}
.empty{padding:30px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar-h b{font-weight:600}.bar-h span{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:9px;border-radius:5px;background:var(--chip);overflow:hidden}
.fill{height:100%;border-radius:5px}
.trend{display:flex;gap:10px;align-items:flex-end;height:170px;margin-top:16px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.tbars{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
.tb{width:34%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.tb.in{background:var(--pos)} .tb.out{background:var(--btn)}
.tcol small{font-size:12px;color:var(--muted)} .tcol.cur small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ins div{display:flex;gap:10px;font-size:14px}
.ins i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.cal .dh{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em;padding-bottom:2px}
.day{border:1px solid var(--line);border-radius:12px;min-height:104px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--panel);min-width:0}
.day.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px);border-style:dashed}
.day.today{outline:2px solid var(--ink);outline-offset:-1px}
.day .n{font-weight:600;font-size:13px}
.day.today .n{color:var(--neg)}
.chip{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:6px;border-radius:7px;padding:3px 7px;font-size:12px;cursor:pointer;background:var(--chip);color:var(--chip-ink);min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:var(--pos-bg);color:var(--pos)}
.chip.wait{background:transparent;border:1.5px dashed var(--pos);color:var(--pos)}
.chip.bill{background:var(--chip);color:var(--chip-ink)}
.chip:focus-visible{outline:2px solid var(--btn)}
.more{font-size:12px;color:var(--muted)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px;align-items:center}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:6px}
.cc{border:2px solid transparent;border-radius:18px;padding:18px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:176px;position:relative}
.cc[aria-pressed="true"]{border-color:var(--ink)}
.cc .nm{font:500 20px var(--f-display)} .cc .big{font:500 26px var(--f-display);font-variant-numeric:tabular-nums}
.cc .meta{font-size:12.5px;opacity:.88}
.cc .track{background:rgba(255,255,255,.28);margin-top:auto}.cc .fill{background:#fff}
.cc.add{background:transparent;border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;font-weight:600}

/* ideas */
.idea{display:flex;gap:14px;padding:14px 2px;border-top:1px solid var(--line);align-items:flex-start}
.idea:first-child{border-top:0}
.idea input{margin-top:4px;width:18px;height:18px;accent-color:var(--btn);flex:none}
.idea h3{font-size:15px}.idea p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.idea.done h3{text-decoration:line-through;opacity:.6}

/* form modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:16px;overflow-y:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px}
.sheet h2{font:500 24px var(--f-display)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);min-width:0;width:100%}
.fld.ck{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px}
.fld.ck input{width:18px;height:18px;accent-color:var(--btn)}
.hint{font-size:12px;color:var(--muted)}
.ferr{margin:0;color:var(--neg);font-size:13px;font-weight:600}
.fbtn{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.budget{width:104px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font-size:14px;color:var(--ink)}
.goal{width:64px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 8px}
.tbl td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:36px 16px;margin-top:16px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop:focus-within{border-color:var(--btn)}
.drop:focus-within{outline:2px solid var(--btn);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--chip);border-top-color:var(--btn)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}}
.cs{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);max-width:170px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.pills{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .side{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:6px;align-items:stretch}
  .brand,.eyebrow,.nav .lb,.side-foot{display:none}
  .logo{justify-content:center}
  .nav button{justify-content:center;padding:12px 0;position:relative}
  .nav .badge{position:absolute;top:1px;right:1px;margin:0;min-width:18px;height:18px;font-size:11px;padding:0 4px}
  .wrap{padding-inline:0}
  .main{padding-top:20px}
}
@media (max-width:700px){
  .day{min-height:58px;padding:5px}
  .chip{height:7px;padding:0;border-radius:4px}.chip span{display:none}.chip.wait{border-width:1px}
  .fgrid{grid-template-columns:1fr}
  .row-amt{min-width:0;text-align:left}.row-acts{min-width:0;justify-content:flex-start}
  .mnav .ml{min-width:0;flex:1;text-align:center}
}
@media (prefers-reduced-motion:no-preference){.fill,.tb{transition:width .3s,height .3s}}
</style>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="main"><div class="loading">Carregando seus dados…</div></div></main>
</div>
<div id="modal"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const money=v=>brl.format(Math.round((v||0)*100)/100);

const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const curYm=todayStr.slice(0,7);
const addM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5)+n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const dow1=ym=>new Date(+ym.slice(0,4),+ym.slice(5)-1,1).getDay();
const clampDay=(ym,d)=>Math.min(Math.max(1,d|0),dim(ym));
const mLabel=ym=>MONTHS[+ym.slice(5)-1]+' de '+ym.slice(0,4);
const mShort=ym=>MONTHS[+ym.slice(5)-1].slice(0,3);
const fmtDate=d=>d.slice(8,10)+'/'+d.slice(5,7);
function parseMoney(s){
  s=String(s).replace(/R\$|\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const v=parseFloat(s); return isFinite(v)?Math.round(v*100)/100:NaN;
}
const inputMoney=v=>(v===''||v==null)?'':String(v).replace('.',',');

const CATS=[['Moradia','#8C5A4B'],['Alimentação','#C08A5A'],['Transporte','#5F7F95'],['Saúde','#6F8F72'],['Educação','#8E6F9C'],['Lazer','#C9A24D'],['Assinaturas','#B35C6B'],['Dívidas e parcelas','#7A6F63'],['Compras','#4F9C9A'],['Outros','#9AA05A']];
const CAT_COLOR=Object.fromEntries(CATS);
const CAT_NAMES=CATS.map(c=>c[0]);
const INC_TYPES=['Salário','Freelance / autônomo','Benefício','Aluguel recebido','Reembolso','Outros'];
const CARD_COLORS=['#7A4A3D','#4F6A5C','#4D5D78','#8A5A6B','#7A6A3D','#5A5A5A'];
const PAGES=[
 ['painel','Painel','<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],

/* ---------- persistence ---------- */
function setSave(st){store.state=st;const el=$('#savestate');if(el) el.textContent=saveText()}
function saveText(){
  if(mode==='local') return store.state==='error'?'Não foi possível salvar neste aparelho':'Salvo neste aparelho';
  return {ok:'Salvo na sua conta',saving:'Salvando…',error:'Erro ao salvar. Tente de novo.',slow:'Sua conta ainda não respondeu…'}[store.state]||'';
}
function touch(id){
  store.dirty.add(id);setSave('saving');
  clearTimeout(store.timer);store.timer=setTimeout(flush,350);
}
function touchAll(){touch('cfg');for(const ym in S.months) touch('m-'+ym)}
async function flush(){
  if(store.writing){store.timer=setTimeout(flush,200);return}
  store.writing=true;
  try{
    if(mode==='local'){
      store.dirty.clear();
      try{localStorage.setItem('mc-v1',JSON.stringify(S))}catch(e){throw e}
    }else{
      while(store.dirty.size){
        const id=[...store.dirty][0];store.dirty.delete(id);
        const body=id==='cfg'?S.cfg:S.months[id.slice(2)];
        if(body) await store.col.doc(id).set(JSON.parse(JSON.stringify(body)));
        store.known.add(id);
      }
    }
    setSave('ok');
  }catch(e){setSave('error')}
  finally{store.writing=false}
}
function applyDocs(docs){
  S.cfg=normCfg(docs.cfg);S.months={};
  for(const id in docs) if(id.startsWith('m-')) S.months[id.slice(2)]=normMonth(docs[id]);
}
function loadLocal(){
  let raw=null;try{raw=localStorage.getItem('mc-v1')}catch(e){}
  if(raw){try{const o=JSON.parse(raw);S.cfg=normCfg(o.cfg);S.months={};for(const k in (o.months||{})) S.months[k]=normMonth(o.months[k]);return}catch(e){}}
  seedSample();touchAll();
}
function resetAll(){
  const ids=[...store.known].filter(i=>i!=='cfg');
  S={cfg:newCfg(),months:{}};
  selCard=null;
  if(mode==='cloud'){
    touch('cfg');
    ids.forEach(id=>{store.known.delete(id);store.col.doc(id).delete().catch(()=>setSave('error'))});
  }else touch('cfg');
}

/* ---------- calculations ---------- */
function cardIdx(){
  const idx={};
  for(const ym in S.months) for(const b of S.months[ym].buys){
    const card=S.cfg.cards.find(c=>c.id===b.cardId);if(!card) continue;
    const st=addM(b.date.slice(0,7),(+b.date.slice(8,10)>card.close)?1:0),n=Math.max(1,b.n|0);
    for(let k=0;k<n;k++){const m=addM(st,k);(idx[m]=idx[m]||[]).push({b,card,k,n,amount:b.value/n})}
  }
  return idx;
}
const fixedFor=ym=>S.cfg.fixed.filter(f=>f.start<=ym&&(!f.end||ym<=f.end));
function calc(ym,idx){
  const doc=S.months[ym]||newMonth();
  const inc=doc.income,fx=fixedFor(ym),vr=doc.vars,cd=idx[ym]||[];
  const incTotal=sum(inc,i=>i.value),got=sum(inc.filter(i=>i.got),i=>i.value);
  const fixedT=sum(fx,f=>f.value),varT=sum(vr,v=>v.value),cardT=sum(cd,c=>c.amount),out=fixedT+varT+cardT;
  const byCat={};
  fx.forEach(f=>byCat[f.cat]=(byCat[f.cat]||0)+f.value);
  vr.forEach(v=>byCat[v.cat]=(byCat[v.cat]||0)+v.value);
  cd.forEach(c=>byCat[c.b.cat]=(byCat[c.b.cat]||0)+c.amount);
  return {doc,inc,got,incTotal,pending:incTotal-got,fx,vr,cd,fixedT,varT,cardT,out,saldo:incTotal-out,byCat};
}
function cardStat(card,idx){
  const fat=(idx[M]||[]).filter(i=>i.card.id===card.id),fatT=sum(fat,i=>i.amount);
  let used=0;
  for(const m in idx) if(m>=M&&!(S.months[m]&&S.months[m].cardPaid[card.id])) used+=sum(idx[m].filter(i=>i.card.id===card.id),i=>i.amount);
  return {fat,fatT,used,avail:card.limit-used,pct:card.limit>0?used/card.limit:0,paid:!!(S.months[M]&&S.months[M].cardPaid[card.id])};
}
function dueDay(card,ym){const dm=card.due>card.close?ym:addM(ym,1);return {ym:dm,day:clampDay(dm,card.due)}}
function billsIn(ym,idx){ // statements whose due date falls in ym
  return S.cfg.cards.map(card=>{
    const stm=card.due>card.close?ym:addM(ym,-1);
    const amount=sum((idx[stm]||[]).filter(i=>i.card.id===card.id),i=>i.amount);
    const paid=!!(S.months[stm]&&S.months[stm].cardPaid[card.id]);
    return {card,stm,amount,paid,day:clampDay(ym,card.due)};
  }).filter(b=>b.amount>0);
}

function openForm(o){
  modal=o;
  const f=o.fields.map(x=>{
    const v=o.values[x.k],id='f_'+x.k,full=x.full?' full':'';
    if(x.t==='check') return `<label class="fld ck full"><input type="checkbox" id="${id}" ${v?'checked':''}>${esc(x.label)}</label>`;
    let inp;
    if(x.t==='select') inp=`<select id="${id}">${x.opts.map(([val,l])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(x.t==='money') inp=`<input id="${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(inputMoney(v))}">`;
    else if(x.t==='int') inp=`<input id="${id}" type="number" min="${x.min||1}" max="${x.max||31}" step="1" value="${esc(v)}">`;
    else if(x.t==='date') inp=`<input id="${id}" type="date" value="${esc(v)}">`;
    else inp=`<input id="${id}" type="text" autocomplete="off" value="${esc(v)}">`;
    return `<label class="fld${full}">${esc(x.label)}${inp}${x.hint?`<span class="hint">${esc(x.hint)}</span>`:''}</label>`;
  }).join('');
  $('#modal').innerHTML=`<div class="ov" data-act="close-modal"><form class="sheet" id="mform" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate>
    <h2 id="mt">${esc(o.title)}</h2><div class="fgrid">${f}</div><p class="ferr" id="ferr" hidden></p>
    <div class="fbtn"><button type="button" class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div>`;
  const first=$('#mform input[type=text],#mform select');if(first) first.focus();
}
function closeModal(){modal=null;$('#modal').innerHTML=''}
function submitForm(){
  const o=modal;if(!o) return;const out={};
  for(const x of o.fields){
    const el=$('#f_'+x.k);let v;
    if(x.t==='check') v=el.checked;
    else{v=el.value.trim();if(x.t==='money') v=parseMoney(v);else if(x.t==='int') v=parseInt(v,10)}
    if(x.req){
      const bad=x.t==='money'?!(v>0):x.t==='int'?!(v>=(x.min||1)&&v<=(x.max||31)):!v;
      if(bad){const e=$('#ferr');e.hidden=false;e.textContent=x.t==='money'?`Preencha "${x.label}" com um valor maior que zero.`:`Preencha "${x.label}".`;el.focus();return}
    }
    out[x.k]=v;
  }
  o.onSave(out);closeModal();render();
}

/* ---------- pages ---------- */
function insights(s,idx){
  const out=[],ps=[];
  if(s.incTotal===0) out.push(['warn','Cadastre suas entradas em '+mLabel(M)+' para ver o saldo e a meta de poupança.']);
  if(s.incTotal>0&&s.saldo<0) out.push(['neg',`Saídas passaram das entradas em ${money(-s.saldo)}. Comece cortando na maior categoria.`]);
  const cats=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length&&s.out>0&&cats[0][1]/s.out>.35) out.push(['warn',`${cats[0][0]} leva ${pct(cats[0][1]/s.out)} de tudo o que você gasta (${money(cats[0][1])}). Vale revisar primeiro.`]);
  CAT_NAMES.forEach(c=>{const b=S.cfg.budgets[c];if(b>0&&(s.byCat[c]||0)>b) ps.push(`${c} passou da meta em ${money(s.byCat[c]-b)}`)});
  if(ps.length) out.push(['neg',ps.slice(0,3).join('. ')+'.']);
  S.cfg.cards.forEach(c=>{const st=cardStat(c,idx);if(st.pct>=.7) out.push(['warn',`${c.name} está com ${pct(st.pct)} do limite comprometido (fatura e parcelas futuras).`])});
  if(s.incTotal>0&&s.fixedT/s.incTotal>.5) out.push(['warn',`Gastos fixos consomem ${pct(s.fixedT/s.incTotal)} da renda. Renegocie contratos e revise assinaturas.`]);
  const ass=s.byCat['Assinaturas']||0;
  if(ass>0) out.push(['mute',`Assinaturas somam ${money(ass)} por mês, ${money(ass*12)} por ano. Cancele as que você não usa.`]);
  let fut=0;for(const m in idx) if(m>M) fut+=sum(idx[m],i=>i.amount);
  if(fut>0) out.push(['mute',`Já existem ${money(fut)} em parcelas de cartão nos próximos meses. Evite novos parcelamentos até aliviar.`]);
  if(M===curYm){const d=+todayStr.slice(8);if(d>=4&&s.varT>0){const proj=s.varT/d*dim(M);out.push(['mute',`No ritmo atual, os gastos variáveis fecham o mês em cerca de ${money(proj)}.`])}}
  const goal=s.incTotal*S.cfg.goalPct/100;
  if(s.incTotal>0&&s.saldo>=0&&s.saldo<goal) out.push(['warn',`Faltam ${money(goal-s.saldo)} para a meta de poupança de ${S.cfg.goalPct}%.`]);
  if(!out.length) out.push(['pos','Tudo em ordem por aqui. Mantenha a revisão semanal.']);
  return out.slice(0,6);
}
const toneColor={pos:'var(--pos)',neg:'var(--neg)',warn:'var(--warn)',mute:'var(--muted)'};

function pgPainel(){
  const idx=cardIdx(),s=calc(M,idx),p=s.incTotal>0?s.out/s.incTotal:0;
  let tone,msg;
  if(s.incTotal===0&&s.out===0){tone='mute';msg='Comece cadastrando suas entradas e seus gastos deste mês.'}
  else if(s.incTotal===0){tone='warn';msg='Há gastos em '+mLabel(M)+', mas nenhuma entrada cadastrada.'}
  else if(s.saldo<0){tone='neg';msg=`Você gastou ${money(-s.saldo)} a mais do que entrou em ${mLabel(M)}.`}
  else if(p>.9){tone='warn';msg=`Pouca folga: ${pct(p)} da renda já está comprometida.`}
  else{tone='pos';msg=`No azul: sobram ${money(s.saldo)} em ${mLabel(M)}.`}
  // categories
  const cats=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]),top=cats.length?cats[0][1]:1;
  const catHtml=cats.length?`<div class="bars">${cats.map(([c,v])=>{
    const b=S.cfg.budgets[c],over=b>0&&v>b,w=b>0?Math.min(1,v/b):v/top;
    return `<div><div class="bar-h"><b>${esc(c)}</b><span>${money(v)}${b>0?' de '+money(b):' · '+pct(s.out?v/s.out:0)}</span></div><div class="track"><div class="fill" style="width:${Math.round(w*100)}%;background:${over?'var(--neg)':CAT_COLOR[c]||'var(--muted)'}"></div></div></div>`}).join('')}</div>`:emptyHtml('Nenhum gasto neste mês ainda.',`<button class="btn sm" data-act="add-var">+ Lançar gasto</button>`);
  // trend
  const months=[-5,-4,-3,-2,-1,0].map(o=>addM(M,o)),tr=months.map(m=>({m,...calc(m,idx)}));
  const mx=Math.max(1,...tr.map(t=>Math.max(t.incTotal,t.out)));
  const trend=`<div class="trend">${tr.map(t=>`<div class="tcol${t.m===M?' cur':''}"><div class="tbars"><div class="tb in" style="height:${t.incTotal/mx*100}%" title="Entradas ${money(t.incTotal)}"></div><div class="tb out" style="height:${t.out/mx*100}%" title="Saídas ${money(t.out)}"></div></div><small>${mShort(t.m)}</small></div>`).join('')}</div><div class="legend"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--btn)"></i>Saídas</span></div>`;
  // vencimentos
  const due=[];
  s.fx.forEach(f=>{if(!s.doc.paid[f.id]) due.push({day:clampDay(M,f.day),t:f.desc,v:f.value,act:'toggle-fixed',id:f.id})});
  billsIn(M,idx).forEach(b=>{if(!b.paid) due.push({day:b.day,t:'Fatura '+b.card.name,v:b.amount,act:'toggle-card',id:b.card.id,stm:b.stm})});
  due.sort((a,b)=>a.day-b.day);
  const dueHtml=due.length?`<div class="list">${due.slice(0,7).map(d=>{
    const late=M===curYm?d.day<+todayStr.slice(8):M<curYm;
    return `<div class="row"><div class="row-main"><div class="row-t">${esc(d.t)}</div><div class="row-s">Dia ${d.day} · ${money(d.v)}</div></div>${late?'<span class="pill neg">Atrasado</span>':''}<button type="button" class="pill" data-act="${d.act}" data-id="${esc(d.id)}" data-stm="${esc(d.stm||'')}">Marcar pago</button></div>`}).join('')}</div>${due.length>7?`<div class="sub" style="margin-top:8px">+${due.length-7} outras contas</div>`:''}`:emptyHtml('Nenhuma conta pendente neste mês.');
  // savings
  const goal=s.incTotal*S.cfg.goalPct/100,prog=goal>0?Math.max(0,Math.min(1,s.saldo/goal)):0;
  const g50=[['Necessidades (fixos)',s.fixedT,.5],['Desejos (variáveis e cartão)',s.varT+s.cardT,.3],['Poupança (saldo)',Math.max(0,s.saldo),.2]];
  const sav=`<div style="display:flex;align-items:center;gap:8px;margin:8px 0 12px" class="sub">Guardar <input class="goal" type="number" min="0" max="100" step="1" value="${S.cfg.goalPct}" data-goal aria-label="Meta de poupança em porcentagem"> % da renda</div>
    <div class="bar-h"><b>${money(Math.max(0,s.saldo))}</b><span>meta ${money(goal)}</span></div><div class="track"><div class="fill" style="width:${prog*100}%;background:var(--pos)"></div></div>
    <p class="sub" style="margin:10px 0 0">Para cumprir a meta, o teto de gastos do mês é <b>${money(s.incTotal-goal)}</b>.</p>
    <div class="bars" style="gap:10px;margin-top:16px">${g50.map(([l,v,i])=>{const r=s.incTotal>0?v/s.incTotal:0;return `<div><div class="bar-h" style="font-size:13px"><span>${l}</span><span>${pct(r)} · ideal ${pct(i)}</span></div><div class="track" style="height:6px"><div class="fill" style="width:${Math.min(100,r/i*100)}%;background:${l.startsWith('Poup')?(r>=i?'var(--pos)':'var(--warn)'):(r>i?'var(--neg)':'var(--pos)')}"></div></div></div>`}).join('')}</div>`;
  const ins=insights(s,idx);
  return head('Painel')+sampleNote()+
   `<div class="banner ${tone}">${esc(msg)}</div>
   <div class="tiles">
     ${tile('Entradas',money(s.incTotal),`${money(s.got)} recebido · ${money(s.pending)} a receber`)}
     ${tile('Saídas',money(s.out),`Fixos ${money(s.fixedT)} · Variáveis ${money(s.varT)} · Cartões ${money(s.cardT)}`)}
     ${tile('Saldo do mês',money(s.saldo),s.incTotal>0?'Entradas menos saídas':'Sem entradas cadastradas',s.saldo<0?'neg':'pos')}
     ${tile('Renda comprometida',pct(p),'Das entradas já vai para gastos')}
   </div>
   <div class="grid2"><div class="stack">
     <section class="panel"><h2>Para onde foi o dinheiro</h2><div class="sub">Gastos por categoria, comparados com a meta quando existe.</div>${catHtml}</section>
     <section class="panel"><h2>Entradas e saídas, seis meses</h2><div class="sub">Até ${esc(mLabel(M))}</div>${trend}</section>
   </div><div class="stack">
     <section class="panel"><h2>Ideias para este mês</h2><div class="ins">${ins.map(([t,x])=>`<div><i style="background:${toneColor[t]}"></i><span>${esc(x)}</span></div>`).join('')}</div></section>
     <section class="panel"><h2>Meta de poupança</h2>${sav}</section>
     <section class="panel"><h2>Contas a pagar</h2>${dueHtml}</section>
   </div></div>`;
}

  return head('Cartões',`<button class="btn" data-act="add-buy">+ Nova compra</button>`)+sampleNote()+ctabs()+
   `<section class="panel"><h2>Meus cartões</h2><div class="sub">Compras entram na fatura pelo dia de fechamento. Parcelas se espalham pelos meses seguintes.</div><div class="cards">${grid}<button type="button" class="cc add" data-act="add-card">+ Adicionar cartão</button></div></section>${detail}${cards.length?future:''}`;
}

/* ---------- importar fatura ---------- */
const CDN_PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=()=>no(new Error('script'));document.head.appendChild(el)})}
async function getPdfjs(){
  if(!window.pdfjsLib) await loadScript(CDN_PDF+'pdf.min.js');
  if(!window.pdfjsWorker) await loadScript(CDN_PDF+'pdf.worker.min.js');
  return window.pdfjsLib;
}
async function readPdf(file,password){
  const lib=await getPdfjs();
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password:password||undefined}).promise;
  let text='';
  for(let n=1;n<=Math.min(pdf.numPages,12);n++){
    const pg=await pdf.getPage(n),tc=await pg.getTextContent(),rows={};
    tc.items.forEach(it=>{if(!it.str||!it.str.trim()) return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push([it.transform[4],it.str])});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{text+=rows[y].sort((a,b)=>a[0]-b[0]).map(r=>r[1]).join(' ')+'\n'});
  }
  return {text,pdf};
}
async function pdfImages(pdf,max){
  const out=[];
  for(let n=1;n<=Math.min(pdf.numPages,max);n++){
    const pg=await pdf.getPage(n),vp=pg.getViewport({scale:1.6}),cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)));
  }
  return out;
}
async function getSample(){
  if(sampleFn!==undefined) return sampleFn;
  try{sampleFn=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){sampleFn=null}
  return sampleFn;
}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const toks=s=>norm(s).split(' ').filter(t=>t.length>=3&&!/^\d+$/.test(t));
function markDups(){
  const ex=(cardIdx()[imp.ym]||[]).filter(i=>i.card.id===imp.cardId);
  imp.lines.forEach(l=>{
    const t=toks(l.desc);
    l.dup=ex.some(e=>Math.abs(e.amount-l.amount)<0.011&&toks(e.b.desc).some(x=>t.includes(x)));
    l.sel=!l.dup&&l.kind!=='pagamento';
  });
}
function impFail(e){
  imp.step='start';imp.ctl=null;
  const code=e&&e.code;
  if(code==='cancelled'){imp.err='';render();return}
  if(e&&e.name==='PasswordException'){imp.needPass=true;imp.err=e.code===2?'Senha incorreta. Tente de novo.':'Este PDF tem senha. Muitos bancos usam os primeiros dígitos do CPF.';render();return}
  imp.needPass=false;
  const msgs={images_unavailable:'Neste aparelho não dá para enviar fotos. Use o PDF ou o CSV da fatura.',too_many:`Envie no máximo ${e&&e.max} imagens por vez.`,one_file:'Envie um arquivo por vez (ou várias imagens).',scanned:'Não consegui ler o texto desse PDF. Tire um print das páginas e envie as imagens.',not_granted:'Você não permitiu que o Claude leia o arquivo. Autorize para importar.',rate_limited:'Muitas leituras seguidas. Aguarde um pouco e tente de novo.',image_rejected:'Imagem não aceita. Use JPG, PNG ou WebP de até 20 MB.',invalid_json:'Não consegui entender a fatura. Tente de novo ou envie o PDF ou CSV.',refused:'Não foi possível ler esse arquivo.',prompt_too_large:'O arquivo é grande demais. Envie só as páginas com os lançamentos.',sampling_disabled:'A leitura automática não está liberada para a sua conta.',session_expired:'Sua sessão expirou. Entre de novo e tente outra vez.'};
  imp.err=msgs[code]||(e&&e.message==='script'?'Não consegui carregar o leitor de PDF. Envie um CSV ou fotos da fatura.':'Não consegui ler esse arquivo. Tente de novo ou use + Nova compra.');
  render();
}
async function importFiles(files){
  files=[...files];if(!files.length) return;
  const card=S.cfg.cards.find(c=>c.id===imp.cardId);if(!card) return;
  const fn=await getSample();
  if(!fn){imp.err='A leitura automática não está disponível aqui.';render();return}
  const isImg=f=>/^image\//.test(f.type);
  if(files.some(isImg)&&!files.every(isImg)){imp.err='Envie só imagens ou só um arquivo (PDF, CSV ou OFX) de cada vez.';render();return}
  imp.err='';imp.step='reading';imp.msg='Abrindo o arquivo…';imp.file=files.map(f=>f.name).join(', ');render();
  try{
    let text='',blobs=null;
    const lim=await fn.limits().catch(()=>null);
    if(files.every(isImg)){
      if(!lim||!lim.images) throw {code:'images_unavailable'};
      if(files.length>lim.images.maxCount) throw {code:'too_many',max:lim.images.maxCount};
      blobs=files;
    }else{
      if(files.length>1) throw {code:'one_file'};
      const f=files[0],nm=f.name.toLowerCase();
      if(f.type==='application/pdf'||nm.endsWith('.pdf')){
        imp.pending=f;
        const r=await readPdf(f,imp.pass);
        imp.pass='';imp.pending=null;imp.needPass=false;
        if(r.text.replace(/\s/g,'').length<150){
          if(!lim||!lim.images) throw {code:'scanned'};
          blobs=await pdfImages(r.pdf,lim.images.maxCount);
        }else text=r.text;
      }else text=await f.text();
    }
    await analyze(fn,card,text,blobs);
  }catch(e){impFail(e)}
}
async function analyze(fn,card,text,blobs){
  const ctl=new AbortController();imp.ctl=ctl;imp.msg='O Claude está lendo a fatura…';render();
  const prompt=[
   'Você lê faturas de cartão de crédito de bancos brasileiros e devolve os lançamentos em JSON.',
   `Cartão: ${card.name} (fecha dia ${card.close}, vence dia ${card.due}). Mês de referência informado: ${mLabel(imp.ym)}.`,
   `Categorias permitidas: ${CAT_NAMES.join(', ')}.`,
   'Responda somente com um objeto JSON neste formato:',
   '{"due_date":"AAAA-MM-DD ou null","statement_total":número ou null,"lines":[{"date":"AAAA-MM-DD ou null","desc":"texto curto","amount":número,"installment":{"k":3,"n":10} ou null,"cat":"uma categoria permitida","kind":"compra|encargo|estorno|pagamento"}]}',
   'Regras:',
   '- Inclua cada lançamento da fatura, na ordem. Não invente nada. Ignore totais, limites, pagamento mínimo, simulações de parcelamento e propaganda.',
   '- "amount" é o valor cobrado nesta fatura, em reais, número com ponto decimal. Estornos e créditos são negativos.',
   '- Compra parcelada aparece como "03/10" ou "parcela 3 de 10": preencha installment com k e n e use em amount só o valor da parcela.',
   '- Pagamentos da fatura anterior têm kind "pagamento". Juros, multa, IOF, anuidade e seguros têm kind "encargo".',
   '- As datas vêm como dia/mês: deduza o ano pelo vencimento e pelo mês de referência (compra de dezembro numa fatura de janeiro é do ano anterior).',
   '- Em "cat", escolha a categoria que melhor combina com o estabelecimento (mercado = Alimentação, app de transporte = Transporte, farmácia = Saúde). Use Outros se não souber.',
   blobs?'\nAs imagens anexas são as páginas da fatura.':'\nTEXTO DA FATURA:\n'+text.slice(0,200000)
  ].join('\n');
  const opts={signal:ctl.signal,modelTier:'default',cache:false};
  if(blobs) opts.images=blobs;
  const res=await fn.json(prompt,opts);
  imp.ctl=null;
  const arr=Array.isArray(res)?res:(res&&res.lines);
  if(!Array.isArray(arr)||!arr.length) throw {code:'invalid_json'};
  imp.lines=arr.map(l=>{
    const amount=Number(l&&l.amount);if(!isFinite(amount)||!l.desc) return null;
    let kind=String(l.kind||'compra').toLowerCase();if(!['compra','encargo','estorno','pagamento'].includes(kind)) kind='compra';
    if(amount<0&&kind==='compra') kind='estorno';
    const ins=l.installment&&+l.installment.n>1&&+l.installment.k>=1&&+l.installment.k<=+l.installment.n?{k:+l.installment.k,n:+l.installment.n}:null;
    return {date:/^\d{4}-\d{2}-\d{2}$/.test(l.date)?l.date:null,desc:String(l.desc).slice(0,80),amount:Math.round(amount*100)/100,inst:ins,cat:CAT_NAMES.includes(l.cat)?l.cat:'Outros',kind};
  }).filter(Boolean);
  if(!imp.lines.length) throw {code:'invalid_json'};
  imp.total=(res&&typeof res.statement_total==='number')?res.statement_total:null;
  imp.due=(res&&/^\d{4}-\d{2}-\d{2}$/.test(res.due_date))?res.due_date:null;
  if(imp.due) imp.ym=card.due>card.close?imp.due.slice(0,7):addM(imp.due.slice(0,7),-1);
  markDups();imp.step='review';render();
}
function landDate(l,card,ym){
  const stOf=d=>addM(d.slice(0,7),(+d.slice(8,10)>card.close)?1:0);
  if(l.date&&stOf(l.date)===ym&&!(l.inst&&l.inst.k>1)) return l.date;
  return ym+'-'+pad(Math.min(card.close,dim(ym)));
}
function doImport(){
  const card=S.cfg.cards.find(c=>c.id===imp.cardId);if(!card) return;
  let n=0;
  imp.lines.forEach(l=>{
    if(!l.sel) return;
    const rem=l.inst?l.inst.n-l.inst.k+1:1;
    putItem('buys',{id:uid(),cardId:card.id,date:landDate(l,card,imp.ym),desc:l.desc,cat:l.kind==='encargo'?'Dívidas e parcelas':l.cat,value:Math.round(l.amount*rem*100)/100,n:rem});
    n++;
  });
  imp.step='done';imp.count=n;
}
function monthOpts(sel){const set=new Set([-6,-5,-4,-3,-2,-1,0,1,2].map(o=>addM(curYm,o)));set.add(sel);return [...set].sort().map(m=>`<option value="${m}" ${m===sel?'selected':''}>${esc(mLabel(m))}</option>`).join('')}
function pgImport(){

  if(imp.step==='done') return `<section class="panel"><h2>Fatura importada</h2><p>${imp.count} lançamento${imp.count===1?'':'s'} entraram na fatura de ${esc(mLabel(imp.ym))} do cartão ${esc(card.name)}.</p><div class="ib"><button type="button" class="btn" data-act="imp-view">Ver a fatura</button><button type="button" class="btn ghost" data-act="imp-reset">Importar outra</button></div></section>`;

      return `<tr><td><input type="checkbox" data-impsel="${i}" ${l.sel?'checked':''} ${l.kind==='pagamento'?'disabled':''} aria-label="Importar ${esc(l.desc)}"></td><td>${l.date?fmtDate(l.date):'-'}</td><td>${esc(l.desc)}<span class="pills">${b.join('')}</span></td>
        <td><select class="cs" data-impcat="${i}" aria-label="Categoria de ${esc(l.desc)}">${CAT_NAMES.map(c=>`<option ${c===l.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></td><td class="r ${l.amount<0?'pos':''}">${money(l.amount)}</td></tr>`}).join('');
    return `<section class="panel"><h2>Confira antes de salvar</h2><div class="sub">${esc(imp.file||'')}${imp.due?` · vencimento ${fmtDate(imp.due)}/${imp.due.slice(0,4)}`:''}</div>${pickers}

  }

function doDelete(key){

  else if(kind==='card'){S.cfg.cards=S.cfg.cards.filter(c=>c.id!==id);for(const ym in S.months){const d=S.months[ym],n=d.buys.length;d.buys=d.buys.filter(b=>b.cardId!==id);if(d.buys.length!==n) touch('m-'+ym)}touch('cfg');selCard=null}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.impfile!==undefined){const fl=[...(t.files||[])];t.value='';if(fl.length) importFiles(fl)}
  else if(t.dataset.imp!==undefined){imp[t.dataset.imp]=t.value;if(imp.step==='review') markDups();render()}
  else if(t.dataset.impsel!==undefined){imp.lines[+t.dataset.impsel].sel=t.checked;render()}
  else if(t.dataset.impcat!==undefined){imp.lines[+t.dataset.impcat].cat=t.value;render()}
  else if(t.dataset.budget!==undefined){const v=parseMoney(t.value);if(v>0) S.cfg.budgets[t.dataset.budget]=v;else delete S.cfg.budgets[t.dataset.budget];touch('cfg');render()}
  else if(t.dataset.goal!==undefined){const v=Math.max(0,Math.min(100,parseFloat(t.value)||0));S.cfg.goalPct=v;touch('cfg');render()}
  else if(t.dataset.idea!==undefined){const i=+t.dataset.idea,a=S.cfg.ideasDone,j=a.indexOf(i);if(j>=0) a.splice(j,1);else a.push(i);touch('cfg');render()}
  else if(t.dataset.bills!==undefined){showBills=t.checked;render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='mform'){e.preventDefault();submitForm()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal) closeModal()});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]')) e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();importFiles([...e.dataTransfer.files])}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h)&&h!==view){view=h;render()}});

/* ---------- boot ---------- */
async function boot(){
  let db=null,id=null;
  try{
    if(window.claude&&window.claude.use){
      const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(d&&u){id=await u.id();if(id) db=d}
    }
  }catch(e){db=null}
  if(!db){mode='local';loadLocal();ready=true;render();return}
  mode='cloud';store.col=db.collection('data/users/'+id);
  const slow=setTimeout(()=>{if(!ready){$('#main').innerHTML='<div class="loading">Ainda não consegui falar com a sua conta. Aguarde um instante…</div>'}else setSave('slow')},10000);
  store.col.onSnapshot(snap=>{
    clearTimeout(slow);
    if(store.dirty.size||store.writing) return;
    const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data();store.known.add(d.id)});
    if(!docs.cfg){
      if(!S.cfg){seedSample();touchAll()}
    }else applyDocs(docs);
    if(!ready){ready=true}
    if(store.state==='slow') setSave('ok');
    render();
  },()=>{if(!ready){mode='local';loadLocal();ready=true}setSave('error');render()});
}
boot();
})();
</script>
